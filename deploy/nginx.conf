# nginx do formulário (porta 8080, sem root). O Traefik cuida do HTTPS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Usado pelo HEALTHCHECK do Dockerfile
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Gerado na subida do container (deploy/gerar-env.sh)
    location = /env.js {
        alias /tmp/env.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # "no-cache" = o navegador guarda, mas confere a cada visita se o arquivo mudou.
    # Assim um deploy novo aparece na hora, sem depender do "?v=" dos links.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
