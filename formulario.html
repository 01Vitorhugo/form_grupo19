<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale conosco · Grupo 19</title>

    <!-- Tema: escuro é o padrão; o claro vem do cookie g19_theme (mesmo dos apps G19).
         Roda antes do CSS para a página não piscar no tema errado. -->
    <script>
        if (/(?:^|;\s*)g19_theme=light/.test(document.cookie)) {
            document.documentElement.dataset.theme = 'light';
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="formulario.css?v=dev">
</head>

<body>

    <main class="form-container">

        <button type="button" class="theme-switch" id="theme-switch" aria-label="Alternar tema claro/escuro"
            title="Alternar tema">
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
        </button>

        <div class="form-head">
            <span class="brand-mark" aria-hidden="true">G19</span>
            <div class="page-title">
                <p>Fale conosco</p>
                <h1>Grupo 19</h1>
            </div>
        </div>

        <p class="form-intro">Preencha os dados abaixo e retornaremos o contato o mais rápido possível.</p>

        <form id="form-contato" novalidate>

            <div class="form-grid">

                <div class="input-group full">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name"
                        required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com"
                        autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone / WhatsApp <small>(opcional)</small></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric"
                        autocomplete="tel-national" maxlength="15" pattern="^\(\d{2}\) \d{4,5}-\d{4}$"
                        title="Use o formato (00) 00000-0000 ou (00) 0000-0000">
                </div>

                <div class="input-group full">
                    <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto" required>
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="duvida">Dúvida</option>
                        <option value="orcamento">Orçamento</option>
                        <option value="suporte">Suporte</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="input-group full">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."
                        minlength="10" required></textarea>
                </div>

                <div class="input-group full">
                    <label for="imagem">Imagem <small>(opcional)</small></label>
                    <input type="file" name="imagem" id="imagem" class="file-input" accept="image/*">
                    <label for="imagem" class="file-drop">
                        <span class="file-drop-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <circle cx="9" cy="9" r="2" />
                                <path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21" />
                            </svg>
                        </span>
                        <span class="file-drop-text">
                            <strong id="imagem-nome">Escolher imagem</strong>
                            <small>PNG, JPG ou WEBP até 5 MB</small>
                        </span>
                    </label>
                </div>

            </div>

            <button type="submit" class="btn-submit" id="btn-enviar">Enviar mensagem</button>

            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

        </form>

        <p class="form-footer">Grupo 19 · seus dados são usados apenas para retornar o contato.</p>
    </main>

    <!-- 1. Biblioteca do Supabase (versão fixa) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <!-- 2. Variáveis do .env (gerado por "node gerar-env.js") -->
    <script src="env.js?v=dev"></script>
    <!-- 3. Configuração do Supabase e do webhook -->
    <script src="supabase-config.js?v=dev"></script>
    <!-- 4. Lógica do formulário -->
    <script src="formulario.js?v=dev"></script>

</body>

</html>
